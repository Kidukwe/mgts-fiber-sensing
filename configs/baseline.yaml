project:
  name: mgts-fiber-sensing
  random_seed: 42

data:
  raw_dir: MGTS_data
  sample_dir: data/sample
  file_pattern: "*.csv"
  required_columns:
    - dts_id
    - channel_id
    - timestamp
    - points

# Семантика данных требует подтверждения; не заполнять поля предположениями.
semantics:
  naive_timestamp_timezone: null
  missing_value_sentinels: []
  coordinate_unit: null
  signal_unit: null

# Техническая маска: -300 исключается независимо от неясного физического смысла.
quality:
  excluded_signal_values: [-300.0]
  exclude_nonfinite: true

# Предложение JOTB-5: перед этапом JOTB-6 согласовать docs/ml_task_jotb_5.md.
experiment:
  task_type: regression
  source_file: 2.csv
  target: next_regular_profile_zone_median
  sample_unit: sensor_channel_zone_decision_time
  common_prefix_points: 2120
  zone_width_points: 40
  input_profiles: 5
  next_interval_seconds_min: 120
  next_interval_seconds_max: 121
  split_strategy: chronological_with_embargo
  split_timezone: UTC
  train_start: "2026-04-10T00:00:00+00:00"
  train_end_exclusive: "2026-04-10T14:00:00+00:00"
  validation_start: "2026-04-10T14:12:00+00:00"
  validation_end_exclusive: "2026-04-10T19:00:00+00:00"
  test_start: "2026-04-10T19:12:00+00:00"
  test_end_exclusive: "2026-04-11T00:00:00+00:00"
  metric: mae
  baseline_model: persistence

# Гипотезы для проверки после первого baseline, не подтверждённое улучшение.
spatial_feature_experiment:
  candidates:
    - max_minus_median
    - median_minus_min
    - share_increase
    - share_decrease
    - longest_adjacent_increase
    - longest_adjacent_decrease
  delta_reference: previous_profile_same_coordinate
  delta_threshold: train_only_zone_abs_delta_p95
  robust_extrema_checks:
    - p95_minus_median
    - median_minus_p05
  keep_target_split_and_estimator_fixed: true

outputs:
  audit_report: reports/data_audit.md
  figures_dir: reports/figures
  models_dir: models
